name: Import Android source from Task-new

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskmate-import-android
  cancel-in-progress: false

jobs:
  import-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination task-mate2
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download original Task-new source
        run: |
          git clone --depth 1 --branch main \
            https://github.com/alfianwahyu035-boop/Task-new.git \
            "$RUNNER_TEMP/task-new-source"

      - name: Copy to android-source without touching website root
        run: |
          rm -rf android-source
          mkdir -p android-source
          cp -a "$RUNNER_TEMP/task-new-source/." android-source/
          rm -rf android-source/.git

      - name: Commit Android source to task-mate2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- android-source
          if git diff --cached --quiet; then
            echo "Android source is already up to date."
            exit 0
          fi
          git commit -m "Import Task-new Android source into android-source"
          git push origin HEAD:main
